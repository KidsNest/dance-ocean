<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dance Ocean</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
<style>
  :root{
    --coral:#FF8FA3; --sun:#FFD866; --white:#FFFDF7; --ink:#0B3D3A;
    --ocean-a:#B8E3E9; --ocean-b:#146C94; --ocean-c:#0B4F6C;
    --river-a:#DDEBC6; --river-b:#4C8C4A; --river-c:#274E29;
    --gem:#8E7CFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;font-family:'Nunito',sans-serif;background:#0B4F6C;overflow:hidden;}
  h1,.font-display{font-family:'Baloo 2',sans-serif;}
  #app{position:relative;width:100vw;height:100vh;display:flex;flex-direction:column;color:var(--white);}

  header{padding:10px 16px 4px;text-align:center;background:rgba(6,38,36,.55);border-radius:0 0 18px 18px;}
  header h1{margin:0;font-size:clamp(17px,4.2vw,24px);text-shadow:0 2px 0 rgba(0,0,0,.15);}
  header p{margin:1px 0 0;font-size:11px;opacity:.7;}
  header p .jp{opacity:.55;}

  /* top bar: gems / food */
  #topbar{display:flex;justify-content:center;gap:10px;padding:4px 10px;font-size:12px;}
  .pill{background:rgba(0,0,0,.18);border-radius:999px;padding:3px 10px;display:flex;align-items:center;gap:4px;position:relative;}
  .notify-dot{position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 2px var(--white);animation:gentleFloat 1.6s ease-in-out infinite;pointer-events:none;}
  @keyframes gentleFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}

  /* world tabs */
  #tabs{display:flex;gap:8px;padding:6px 12px 2px;}
  .tab{
    flex:1; text-align:center; padding:8px 6px; border-radius:14px 14px 0 0;
    font-family:'Baloo 2'; font-size:13px; font-weight:700; cursor:pointer;
    background:rgba(6,38,36,.55); color:var(--white); opacity:.75;
    border:2px solid transparent; position:relative;
  }
  .tab.active{opacity:1;background:rgba(6,38,36,.8);border-color:rgba(255,255,255,.5);}
  .tab.locked{opacity:.5;}
  .tab small{display:block;font-family:'Nunito';font-weight:700;font-size:10px;opacity:.85;}

  /* world picker (used only when there are more worlds than fit as tabs) */
  #worldNav{padding:6px 12px 2px;}
  #worldNav #tabs{padding:0;}
  .world-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;position:relative;
    padding:8px 12px;border-radius:14px 14px 0 0;border:2px solid rgba(255,255,255,.5);cursor:pointer;
    background:rgba(6,38,36,.8);color:var(--white);font-family:'Baloo 2',sans-serif;font-size:15px;font-weight:700;}
  .world-btn small{font-family:'Nunito',sans-serif;font-size:11px;font-weight:700;opacity:.85;margin-left:6px;}
  .world-btn-caret{font-size:12px;opacity:.85;}
  .world-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 6px;}
  .world-card{position:relative;height:96px;border:none;border-radius:16px;cursor:pointer;overflow:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;
    color:var(--white);font-family:'Baloo 2',sans-serif;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);}
  .world-card.current{box-shadow:inset 0 0 0 4px var(--sun);}
  .world-card.locked::before{content:'';position:absolute;inset:0;background:rgba(6,30,25,.55);}
  .world-card > span{position:relative;}
  .wc-emoji{font-size:30px;line-height:1;}
  .wc-name{background:rgba(6,38,36,.78);color:var(--white);border-radius:10px;padding:2px 8px;font-size:13px;font-weight:700;line-height:1.2;text-align:center;}
  .wc-name small{display:block;font-family:'Nunito',sans-serif;font-size:10px;opacity:.9;}
  .wc-req{background:rgba(6,38,36,.85);color:var(--white);border-radius:8px;padding:1px 7px;font-size:11px;font-family:'Nunito',sans-serif;font-weight:800;}
  .world-card .notify-dot{top:6px;right:6px;}
  .locked-overlay .lock-count{font-family:'Baloo 2',sans-serif;font-size:18px;background:rgba(6,38,36,.7);padding:2px 12px;border-radius:10px;}

  #tank{position:relative;flex:1;margin:0 10px 8px;border-radius:0 0 24px 24px;overflow:hidden;box-shadow:inset 0 0 0 3px rgba(255,255,255,.3),0 8px 22px rgba(0,0,0,.35);}
  #tank.music-on{box-shadow:inset 0 0 0 3px rgba(255,216,102,.55),0 0 26px rgba(255,216,102,.25),0 8px 22px rgba(0,0,0,.35);}

  .locked-overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    background:rgba(6,30,25,.55); text-align:center; padding:20px;
  }
  .locked-overlay .lock-emoji{font-size:34px;}
  .locked-overlay p{margin:0;font-size:13px;max-width:240px;opacity:.9;}
  .unlockBtn{margin-top:4px;}

  .bubble{position:absolute;bottom:-30px;border-radius:50%;background:rgba(255,255,255,.5);animation:rise linear infinite;}
  @keyframes rise{0%{transform:translateY(0) scale(1);opacity:.7;}100%{transform:translateY(var(--rise,-115vh)) scale(1.4);opacity:0;}}

  #bgLayer{position:absolute;inset:0;transform-origin:50% 100%;transition:transform .6s ease;pointer-events:none;opacity:.55;}
  #bgLayer svg{position:absolute;inset:0;width:100%;height:100%;display:none;}
  /* v43: the water surface in worlds that have sky above the water (Rice Paddy) */
  #surfaceLine{position:absolute;left:0;right:0;display:none;pointer-events:none;
    height:5px;background:linear-gradient(180deg,#FFFFFF 0 55%,rgba(52,128,184,.75) 55% 100%);box-shadow:0 1px 4px rgba(255,255,255,.6);}

  #creatureLayer{position:absolute;inset:0;z-index:0;transform-origin:50% 50%;transition:transform .6s ease;} /* z-index:0 keeps creature stacking inside this layer (murk overlay stays on top) */
  .murk-overlay{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .6s;
    background:radial-gradient(circle at 50% 40%, rgba(90,70,25,.08), rgba(55,42,18,.85));}

  .creature{position:absolute;width:48px;height:48px;cursor:pointer;filter:drop-shadow(0 3px 3px rgba(0,0,0,.25));transition:width .35s,height .35s,left .1s,top .1s,transform .6s;transform:scale(var(--zoom,1));transform-origin:0 0;}
  .creature .sprite{width:100%;height:100%;transition:transform .35s ease;}
  /* invisible tap area around small creatures (size set per creature in JS, before scaling) */
  .creature::before{content:'';position:absolute;inset:calc(var(--hit,0px) * -1);}
  .creature.headphones::after{content:'🎧';position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:15px;animation:hpPop .3s ease-out;}
  @keyframes hpPop{0%{opacity:0;transform:translateX(-50%) scale(.4);}100%{opacity:1;transform:translateX(-50%) scale(1);}}
  .creature.bop .sprite{ animation: bopdance .42s ease-in-out infinite; }
  @keyframes bopdance{0%{transform:translateY(0) scale(1) var(--flip);}50%{transform:translateY(-7px) scale(1.06,.94) var(--flip);}100%{transform:translateY(0) scale(1) var(--flip);}}
  .creature.bop.body-crab .sprite, .creature.bop.body-star .sprite, .creature.bop.body-shrimp .sprite{ animation: bopwiggle .32s ease-in-out infinite; }
  @keyframes bopwiggle{0%{transform:translateX(0) rotate(0deg) scale(1) var(--flip);}50%{transform:translateX(-5px) rotate(-8deg) scale(1) var(--flip);}100%{transform:translateX(0) rotate(0deg) scale(1) var(--flip);}}
  .creature.bop.body-snail .sprite, .creature.bop.body-turtle .sprite{ animation: bopslow .65s ease-in-out infinite; }
  @keyframes bopslow{0%{transform:translateY(0) rotate(0deg) scale(1) var(--flip);}50%{transform:translateY(-3px) rotate(4deg) scale(1.03,.97) var(--flip);}100%{transform:translateY(0) rotate(0deg) scale(1) var(--flip);}}

  .creature.selected{filter:drop-shadow(0 0 7px var(--sun)) drop-shadow(0 0 3px var(--sun));}
  .creature.beat .sprite{ animation:squish .28s ease-out; }
  @keyframes squish{0%{transform:scale(1) var(--flip);}40%{transform:scale(1.16,.84) var(--flip);}100%{transform:scale(1) var(--flip);}}

  /* a banner that may need two lines: a full-width row that floats up, with the text centred inside it (the float-up animation replaces any transform, so translate(-50%) can't be used to centre) */
  .levelup-row.overlay{position:fixed;z-index:300;} /* v42: above Field Notes (z-index 50) */
  .levelup-row.overlay span{background:rgba(24,32,34,.88);} /* on the white Field Notes card the usual light shade is too faint */
  .levelup-row{position:absolute;left:8%;right:8%;z-index:200;text-align:center;animation:floatup 2.4s ease-out forwards;pointer-events:none;}
  .levelup-row span{display:inline-block;font-family:'Baloo 2';font-size:13px;line-height:1.5;color:var(--sun);text-shadow:0 2px 3px rgba(0,0,0,.55);background:rgba(24,32,34,.6);padding:3px 10px;border-radius:10px;} /* v43: .25 -> .6, readable on the light Rice Paddy sky */
  .levelup{position:absolute;z-index:200;font-family:'Baloo 2';font-size:15px;color:var(--sun);text-shadow:0 2px 3px rgba(0,0,0,.55);animation:floatup 2.4s ease-out forwards;pointer-events:none;white-space:nowrap;background:rgba(24,32,34,.6);padding:3px 8px;border-radius:10px;}
  @keyframes floatup{0%{opacity:0;transform:translateY(6px) scale(.9);}12%{opacity:1;transform:translateY(0) scale(1);}70%{opacity:1;transform:translateY(-14px) scale(1);}100%{opacity:0;transform:translateY(-42px) scale(1);}}
  .sparkle{position:absolute;font-size:20px;animation:sparkleAnim .9s ease-out forwards;pointer-events:none;}
  @keyframes sparkleAnim{0%{transform:scale(.3) translateY(0);opacity:1;}100%{transform:scale(1.4) translateY(-30px);opacity:0;}}

  .namelabel{position:absolute;z-index:200;transform:translate(-10%,-130%);font-family:'Baloo 2';font-size:11px;color:var(--white);background:rgba(0,0,0,.4);padding:2px 8px;border-radius:8px;pointer-events:none;animation:namefade 1.8s ease-out forwards;white-space:nowrap;}
  @keyframes namefade{0%{opacity:0;transform:translate(-10%,-118%);}15%{opacity:1;transform:translate(-10%,-138%);}78%{opacity:1;}100%{opacity:0;transform:translate(-10%,-155%);}}

  .dex-modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50;}
  .dex-modal.hidden{display:none;}
  .dex-card{background:var(--white);color:var(--ink);border-radius:18px;padding:16px 16px 10px;max-width:320px;width:86vw;max-height:74vh;overflow-y:auto;font-family:'Nunito';position:relative;}
  .modal-x{position:absolute;top:10px;right:12px;font-size:20px;line-height:1;background:rgba(0,0,0,.06);border:none;border-radius:50%;width:30px;height:30px;cursor:pointer;color:var(--ink);}
  .dex-card h2{font-family:'Baloo 2';margin:0 0 10px;font-size:18px;}
  /* Field Notes (v34): one row of pictures per world; tap a picture for its page */
  .dex-row{margin:6px 0 10px;}
  .dex-row h3{font-family:'Baloo 2';font-size:14px;margin:0 0 4px;}
  .dex-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;}
  .dex-cell{position:relative;background:#F2F6F7;border:none;border-radius:10px;padding:4px 2px 3px;cursor:pointer;color:var(--ink);font-family:'Baloo 2';display:flex;flex-direction:column;align-items:center;min-width:0;}
  .dex-cell .pic{width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;}
  .dex-cell .pic svg{width:92%;height:92%;}
  .dex-cell .nm{font-size:9.5px;line-height:1.15;text-align:center;min-height:2.3em;display:flex;align-items:center;justify-content:center;overflow-wrap:normal;}
  .dex-cell.locked{cursor:default;opacity:.45;}
  .dex-cell.locked .pic{font-size:20px;}
  .dex-cell .new{position:absolute;top:1px;right:2px;font-size:12px;}
  .dex-page .topbar{display:flex;justify-content:space-between;align-items:center;margin:0 34px 6px 0;gap:6px;}
  /* small grey buttons in Field Notes and the confirm box: the tap area is at least 44x44px (Apple's minimum) */
  .dex-small{border:none;border-radius:999px;background:#E9E9E9;color:var(--ink);font-family:'Baloo 2';font-size:13px;padding:6px 14px;cursor:pointer;min-height:44px;min-width:44px;}
  .dex-page .big{width:150px;height:150px;margin:2px auto 4px;display:flex;align-items:center;justify-content:center;}
  .dex-page .big svg{width:100%;height:100%;}
  /* v43: the big picture of a two-form creature is a button (tap = the other form). No hint text: finding it is part of the fun */
  .dex-page .big.form-toggle{border:none;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .dex-page .big.form-toggle.swapped svg{animation:formSwap .35s ease-out;}
  @keyframes formSwap{0%{transform:scale(.7) rotate(-6deg);opacity:.3;}70%{transform:scale(1.06);opacity:1;}100%{transform:scale(1);}}
  .dex-page .en-name{font-family:'Baloo 2';font-size:22px;text-align:center;margin:0;line-height:1.2;}
  .dex-page .jp-name{font-size:13px;text-align:center;margin:0 0 8px;opacity:.7;}
  .dex-page .name-row{display:flex;align-items:center;justify-content:center;gap:6px;}
  .dex-small.muted{opacity:.35;cursor:default;} /* 🔇 is on: reading is off, and the button says so by looking faded */
  .dex-small.reading{background:#FFD866;}
  .dex-tabs{display:flex;gap:6px;margin:0 0 8px;}
  .dex-tabs .dex-small{flex:1;}
  .dex-tabs .dex-small.on{background:#FFD866;}
  .song-list{display:flex;flex-direction:column;gap:6px;}
  .song{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;border:none;border-radius:12px;background:#F2F6F7;color:var(--ink);font-family:'Baloo 2';font-size:15px;padding:6px 12px;cursor:pointer;text-align:left;}
  .song .em{font-size:22px;width:30px;text-align:center;}
  .song .nm{flex:1;}
  .song .play{font-size:20px;width:30px;text-align:center;}
  .song.playing{background:#FFF1B8;}
  .song.locked{opacity:.45;cursor:default;}
  .dex-page .voice-note{font-size:11px;opacity:.7;margin:-4px 0 8px;} /* v37: tells on a real phone why Japanese was not read */
  .dex-page .fact{font-size:14px;line-height:1.7;margin:0 0 8px;}
  .dex-page .found{font-size:13px;line-height:1.6;background:#FFF6D6;border-radius:10px;padding:7px 10px;margin:0 0 8px;}
  .dex-page .nav{display:flex;justify-content:space-between;align-items:center;gap:6px;margin:4px 0;}
  .dex-page .nav button{min-width:52px;}
  .dex-page .nav button:disabled{opacity:.35;cursor:default;}
  .dex-page .goto{width:100%;max-width:none;margin-top:4px;}
  .dexCloseBtn{width:100%;margin-top:8px;}
  /* 📖 on the selected creature: looks like the other buttons, but its tap area reaches at least 44x44px */
  #dexSelBtn{position:relative;overflow:visible;min-width:44px;padding-left:10px;padding-right:10px;}
  #dexSelBtn::after{content:'';position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%);}
  .confirm-lang{position:absolute;top:8px;right:8px;}

  #hud{padding:5px 14px 2px;font-size:12px;}
  .meter-label{display:flex;justify-content:space-between;margin-bottom:2px;opacity:.95;background:rgba(6,38,36,.55);padding:3px 10px;border-radius:8px;}

  /* Landscape phones: height is the scarce resource here, not width.
     Only kicks in when height is short — normal portrait and typical desktop windows are unaffected. */
  @media (orientation: landscape) and (max-height: 500px){
    header{padding:4px 16px 1px;}
    header p{display:none;}
    header h1{font-size:15px;}
    #topbar{padding:2px 10px;}
    #tabs{padding:2px 10px 0;}
    .tab{padding:4px 6px;}
    .tab small{font-size:9px;}
    #worldNav{padding:2px 10px 0;}
    .world-btn{padding:4px 10px;font-size:13px;}
    #hud{padding:2px 14px 0;}
    .meter-label{padding:2px 8px;font-size:10px;margin-bottom:1px;}
    #controls{padding:3px 12px 6px;min-height:58px;}
    .btn{padding:6px 12px;font-size:11px;}
  }
  .meter{height:9px;border-radius:6px;background:rgba(255,255,255,.18);overflow:hidden;}
  .meter>div{height:100%;border-radius:6px;width:0%;transition:width .3s;}
  .meter.happy>div{background:linear-gradient(90deg,var(--sun),var(--coral));}
  .meter.clarity>div{background:linear-gradient(90deg,#8FE3A0,#3E9C6B);}
  .meter.calm>div{background:linear-gradient(90deg,#9FE3FF,#B9A8FF);}
  .meter.water>div{background:linear-gradient(90deg,#9FE3FF,#3E8FD0);}
  /* quiet worlds: no rising bubbles (marine snow falls instead) */
  #tank.no-bubbles .bubble{display:none;}
  /* gentle glow on the action button when it is the thing to press (e.g. 🤫 Quiet while music plays in the Deep Sea) */
  .btn.hint{animation:hintGlow 1.4s ease-in-out infinite;}
  @keyframes hintGlow{0%,100%{box-shadow:0 3px 0 rgba(0,0,0,.18),0 0 0 0 rgba(255,216,102,0);}50%{box-shadow:0 3px 0 rgba(0,0,0,.18),0 0 0 7px rgba(255,216,102,.9);}}
  .app-version{text-align:right;font-size:10px;color:var(--ink);opacity:.55;margin:8px 2px 0;}

  #controls{display:flex;gap:8px;justify-content:center;align-items:center;padding:6px 12px 14px;flex-wrap:wrap;min-height:88px;align-content:center;}
  .btn{border:none;border-radius:999px;padding:10px 16px;font-family:'Baloo 2';font-size:13px;font-weight:700;color:var(--ink);background:var(--white);box-shadow:0 3px 0 rgba(0,0,0,.18);cursor:pointer;transition:transform .08s;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18);}
  .btn.primary{background:var(--sun);} .btn.playing{background:var(--coral);color:#fff;}
  .btn.ghost{background:rgba(6,38,36,.6);color:var(--white);box-shadow:none;}
  .btn.secondary{background:#E9E9E9;color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.08);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🐠 Dance Ocean</h1>
    <p>Play music, watch them dance and grow <span class="jp">/ 音楽をかけて、いっしょに育てよう</span></p>
  </header>

  <div id="topbar">
    <div class="pill">💎 <span id="gemCount">0</span></div>
    <div class="pill" id="dexBtn" style="cursor:pointer;">📖 <span id="dexCount">0</span>/<span id="dexTotal">15</span><span class="notify-dot" id="dexNotifyDot" style="display:none;"></span></div>
    <div class="pill" id="saveBtn" style="cursor:pointer;">💾</div>
    <div class="pill" id="soundBtn" role="button" aria-label="Sound on" style="cursor:pointer;">🔊</div>
  </div>

  <div id="saveModal" class="dex-modal hidden">
    <div class="dex-card">
      <button class="modal-x" id="saveXBtn">✕</button>
      <h2>💾 Save Code</h2>
      <p style="font-size:12px;opacity:.75;margin:0 0 8px;">Copy this code somewhere safe (notes app, message to yourself). Paste it back in anytime to restore your tank.</p>
      <textarea id="saveCodeOut" readonly style="width:100%;height:64px;font-size:10px;border-radius:8px;border:1px solid #ccc;padding:6px;font-family:monospace;"></textarea>
      <button class="btn primary" id="copyCodeBtn" style="width:100%;margin-top:6px;">Copy Code</button>
      <hr style="margin:14px 0 8px;border:none;border-top:1px solid rgba(0,0,0,.1);">
      <p style="font-size:12px;opacity:.75;margin:0 0 6px;">Paste a code here to load it:</p>
      <textarea id="saveCodeIn" style="width:100%;height:50px;font-size:10px;border-radius:8px;border:1px solid #ccc;padding:6px;font-family:monospace;"></textarea>
      <button class="btn" id="loadCodeBtn" style="width:100%;margin-top:6px;">Load Code</button>
      <button class="btn secondary dexCloseBtn" id="saveCloseBtn" style="width:100%;margin-top:8px;">Close</button>
      <p class="app-version" id="appVersion"></p>
    </div>
  </div>

  <div id="confirmModal" class="dex-modal hidden">
    <div class="dex-card" style="text-align:center;">
      <button class="dex-small confirm-lang" id="confirmLangBtn">日本語</button>
      <p id="confirmText" style="font-size:14px;line-height:1.7;margin:46px 0 18px;"></p>
      <div style="display:flex;gap:10px;">
        <button class="btn secondary" id="confirmNoBtn" style="flex:1;">Cancel</button>
        <button class="btn primary" id="confirmYesBtn" style="flex:1;">Yes</button>
      </div>
    </div>
  </div>

  <div id="worldModal" class="dex-modal hidden">
    <div class="dex-card">
      <button class="modal-x" id="worldXBtn">✕</button>
      <h2>🗺️ Worlds</h2>
      <div id="worldGrid" class="world-grid"></div>
      <button class="btn secondary dexCloseBtn" id="worldCloseBtn">Close</button>
    </div>
  </div>

  <div id="dexModal" class="dex-modal hidden">
    <div class="dex-card">
      <button class="modal-x" id="dexXBtn">✕</button>
      <h2>📖 Field Notes</h2>
      <div class="dex-tabs" id="dexTabs">
        <button class="dex-small" id="dexTabFriends">🐠 Friends</button>
        <button class="dex-small" id="dexTabSongs">🎵 Songs</button>
      </div>
      <div id="dexList"></div>
      <button class="btn primary dexCloseBtn" id="dexCloseBtn">Close</button>
    </div>
  </div>

  <div id="worldNav"></div>

  <div id="hud">

<script>
/* ============ SPRITE DRAWING (side-view, mirrorable) ============
   Real illustration assets aren't something I can hand-draw here,
   so this builds a lightweight sprite SYSTEM: one SVG per species,
   with a JS-driven angle (skew) + horizontal flip based on movement
   direction. Swap in real PNG/SVG art later without touching the logic. */
function eyeSVG(cx, cy, r, mood){
  if(mood==='happy'){
    return `<path d="M${cx-r},${cy} Q${cx},${cy-r*1.5} ${cx+r},${cy}" stroke="#182022" stroke-width="${(r*0.5).toFixed(1)}" fill="none" stroke-linecap="round"/>`;
  }
  if(mood==='uneasy'){
    const w=(r*0.45).toFixed(1);
    return `<path d="M${cx-r},${cy-r*0.7} L${cx+r*0.6},${cy} L${cx-r},${cy+r*0.7}" stroke="#182022" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`+
      `<path d="M${cx+r*1.5},${cy-r*1.6} Q${cx+r*2.2},${cy-r*0.6} ${cx+r*1.5},${cy-r*0.3} Q${cx+r*0.8},${cy-r*0.6} ${cx+r*1.5},${cy-r*1.6} Z" fill="#7FD3FF" stroke="#2A7FB8" stroke-width="0.8"/>`;
  }
  if(mood==='sleepy'){
    return `<path d="M${cx-r},${cy} Q${cx},${cy+r*0.6} ${cx+r},${cy}" stroke="#182022" stroke-width="${(r*0.4).toFixed(1)}" fill="none" stroke-linecap="round"/>`;
  }
  return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff"/><circle cx="${(cx+r*0.2).toFixed(1)}" cy="${cy}" r="${(r*0.45).toFixed(1)}" fill="#182022"/>`;
}

    <ellipse cx="70" cy="44" rx="9" ry="6" fill="${body}"/>
    <ellipse cx="20" cy="20" rx="8" ry="5" fill="${body}"/>
    <ellipse cx="48" cy="28" rx="32" ry="22" fill="${shell}"/>
    <path d="M48,10 L60,28 L48,46 L36,28 Z" fill="${pattern}" opacity="0.55"/>
    <circle cx="48" cy="28" r="7" fill="${pattern}" opacity="0.4"/>
    <ellipse cx="84" cy="24" rx="13" ry="11" fill="${body}"/>
    ${eyeSVG(90,21,4.5,mood)}
  </svg>`;
}

/* ============ CARE TYPES (the four rules, reused by every world) ============ */
const CARE_TYPES = {
  // Music fills the meter; a full meter gives 💎. The meter never drops.
  listen:{ actionGain:6, haltBelow:null, fillsWithMusic:true },
  // The water gets dirtier over time (faster with more / bigger creatures). Clean to recover.
  clean:{ actionGain:15, haltBelow:40, murky:true,
    tick:(w)=>{
      const totalSize = w.creatures.reduce((sum,c)=>sum+STAGE_SIZES[c.stage], 0);
      const decay = 1 + Math.floor(totalSize/150);
      w.meter = Math.max(0, w.meter - decay);
    } },
  // The meter wanders up and down on its own. Adjust to recover.
  drift:{ actionGain:15, haltBelow:40,
    tick:(w)=>{
      const drift = (Math.random()<0.5 ? -1 : 1) * (1 + Math.floor(Math.random()*2));
      w.meter = Math.max(0, Math.min(100, w.meter + drift));
    } },
  // Quiet: only while you are LOOKING at this world (and the page is on screen).
  // Music off -> the meter rises; music on -> it falls. Full gives 💎 and drops back to refillTo (not 0),
  // so a quiet player never falls under haltBelow and the "keep it quiet for a while" streak is not cut by a refill.
  // The action button stops the music. While it is quiet, creatures count as cared for (no sleepy faces).
  quiet:{ actionGain:0, haltBelow:40, quiet:true, riseBy:3, fallBy:4, refillTo:50,
    tick:(w, cfg)=>{
      if(!isLookingAt(cfg)) return;
      const care = CARE_TYPES.quiet;
      if(!state.musicOn){
        w.meter = Math.min(100, w.meter + care.riseBy);
        const now = Date.now(); w.creatures.forEach(c=>c.lastCared = now);
        if(w.meter >= 100){
          w.meter = care.refillTo; state.gems += 5; burstSparkles();
          onMeterFull(cfg.id);
        }
      } else {
        w.meter = Math.max(0, w.meter - care.fallBy);
      }
    } }
};
/* Music just started in a quiet world (▶ Music there, or arriving there with music on, or a song from the music notes later):
   say why the friends look troubled, once. English first; 日本語 if chosen on the Field Notes page (2.12). */
const QUIET_MSG = {en:'Shh… everyone here likes it quiet.', ja:'ここのみんなは、静かなのが好きだよ。'};
function sayQuietPlease(){
  const cfg = WORLD_BY_ID[state.activeWorld];
  if(!(state.musicOn && careOf(cfg).quiet)) return;
  // v42: when Field Notes is open (a song from 🎵 Songs), show the same banner on top of it, not hidden in the tank behind
  const dexOpen = !document.getElementById('dexModal').classList.contains('hidden');
  showBanner(QUIET_MSG, dexOpen ? {overlay:true} : {});
}
/* You are looking at this world right now (it is the active one and the page is not hidden). */
function isLookingAt(cfg){ return state.activeWorld===cfg.id && !document.hidden && state.worlds[cfg.id].unlocked; }
/* Quiet care is "on" only while you look at the world with the music off. */
function isQuietNow(cfg){ return isLookingAt(cfg) && !state.musicOn; }
function careOf(cfg){ return CARE_TYPES[cfg.care] || CARE_TYPES.listen; }

const TAB_LIMIT = 3; // up to this many worlds: tabs. More than this: the world picker screen.
const WORLD_ORDER = WORLDS.map(c=>c.id);
const WORLD_BY_ID = Object.fromEntries(WORLDS.map(c=>[c.id,c]));
function prevWorldOf(id){ const i = WORLD_ORDER.indexOf(id); return i>0 ? WORLDS[i-1] : null; }
function prevIsOpen(id){ const p = prevWorldOf(id); return !p || state.worlds[p.id].unlocked; }
/* The next door waits until you have actually been to the world before it (one door at a time). */
function prevIsVisited(id){ const p = prevWorldOf(id); return !p || (state.worlds[p.id].unlocked && state.worlds[p.id].tabSeen); }
const TOTAL_SPECIES = WORLD_ORDER.reduce((n,id)=>n+(SPECIES[id]||[]).length, 0);

const SHOW_FORM_BANNER = true; // v43: a banner when a creature changes form. Set to false to turn it off.
function speciesOf(world, key){ return (SPECIES[world]||[]).find(s=>s.key===key) || null; }
function formIndexAt(sp, stage){ let i = 0; (sp.forms||[]).forEach((f,j)=>{ if(stage >= f.stage) i = j+1; }); return i; }
function formOf(sp, i){
  if(!i || !sp.forms || !sp.forms[i-1]) return {name:sp.name, jp:sp.jp, draw:sp.draw, body:sp.body||'fish', zone:sp.zone||'water', emoji:''};
  const f = sp.forms[i-1];
  return {name:f.name, jp:f.jp, draw:f.draw, body:f.body||sp.body||'fish', zone:f.zone||sp.zone||'water', emoji:f.emoji||''};
}
function formCount(sp){ return 1 + ((sp.forms||[]).length); }
/* Sets name, look, body type and zone from the Stage. announce: show the banner (not while loading a save). */
function applyForm(c, announce){
  const sp = speciesOf(c.world, c.key); if(!sp) return;
  const i = formIndexAt(sp, c.stage);
  const had = c.form;
  if(had === i) return;
  const before = formOf(sp, had||0), after = formOf(sp, i);
  c.form = i;
  c.name = after.name; c.speciesDraw = after.draw; c.zone = after.zone;
  c.el.className = c.el.className.replace(/\bbody-\S+/, 'body-'+after.body);
  const spriteEl = c.el.querySelector('.sprite'); if(spriteEl) spriteEl.innerHTML = after.draw(c.mood||'neutral');
  if(had == null) return; // first time: just set up
  if(after.zone !== 'water') c._emerge = true; // a frog or dragonfly comes up out of the water first
  scheduleSwim(c);
  if(announce && SHOW_FORM_BANNER && c.world===state.activeWorld){
    showBanner({en:`${after.emoji||'🎉'} The ${before.name} became a ${after.name}!`, ja:`${after.emoji||'🎉'} ${before.jp}が${after.jp}になったよ!`}, {top:'30%', ms:2800});
    burstSparkles();
  }
}
/* Up-and-down range (top of the creature, % of the tank) for a zone. Worlds without a water surface: null (the old range). */
function yRange(world, zone, visualPx){
  const s = WORLD_BY_ID[world].surface;
  if(s==null) return null;
  if(zone==='air'){
    const h = tank.clientHeight || 300;
    const hPct = (visualPx || STAGE_SIZES[1]) / h * 100;
    return [4, Math.max(4, s - hPct)];
  }
  if(zone==='both') return [6, 80];
  return [s + 2, 80]; // water
}

/* Read the page aloud (v36, fixed in v37).
   In the language on screen. English: name, then the fact. 日本語: the English name in an English voice, then the Japanese name
   and fact in a Japanese voice (names are for learning in English). Off while 🔇. Stops when the page changes or Field Notes closes,
   or on a second tap.
   v37: in the iPhone Claude app only the English name was read in 日本語 mode. Not yet known why, so two fixes together:
   (A) pick an actual voice for each language from the device's list (not just the language code), and
   (B) speak one part at a time, starting the next when the previous one ends (not all queued at once).
   If no Japanese voice is found, or a Japanese part fails, a small note says so on the page, to tell on a real phone which it was. */
let readingKey = null;
/* v38: v37 picked "the first voice for the language that is on the device". On iPhone/Mac that list also holds old
   novelty voices (robot, whisper, …), so the reading sounded much worse than Listen (which picks no voice and gets the
   device's normal voice). Now: English picks no voice at all (same as Listen). Japanese still picks one (in v36 Japanese was
   not read without it), but prefers the voice marked as the device default, then better-quality ones, and never a novelty voice. */
const NOVELTY_VOICES = /^(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Fred|Good News|Hysterical|Jester|Junior|Kathy|Organ|Pipe Organ|Ralph|Superstar|Trinoids|Whisper|Wobble|Zarvox)\b/i;
function pickVoice(lang){
  if(!lang.startsWith('ja')) return null; // English: leave it to the device, like Listen
  try{
    const vs = (speechSynthesis.getVoices() || []).filter(v=>!NOVELTY_VOICES.test(v.name||''));
    const ja = vs.filter(v=>(v.lang||'').replace('_','-').toLowerCase().startsWith('ja'));
    const better = v => /enhanced|premium|natural|neural|siri/i.test(v.name||'');
    return ja.find(v=>v.default) || ja.find(better) || ja.find(v=>v.localService) || ja[0] || null;
  }catch(e){ return null; }
}
function voiceCount(){ try{ return (speechSynthesis.getVoices()||[]).length; }catch(e){ return 0; } }
function showVoiceNote(text){
  const n = document.getElementById('dexVoiceNote'); if(n){ n.textContent = text; n.style.display = 'block'; }
}
function stopReading(){
  if(readingKey===null) return;
  readingKey = null;
  try{ if('speechSynthesis' in window) speechSynthesis.cancel(); }catch(e){}
  const b = document.getElementById('dexReadBtn'); if(b) b.classList.remove('reading');
}
/* v39: words the Japanese voice tends to misread. Only the text handed to the voice is changed; the screen keeps the kanji.
   Add a line when a misreading is heard. Longer words first so they win over shorter ones. */
// v41: written in katakana, not hiragana. A run of hiragana (まきがいではめずらしく) made the voice split the words wrongly
// (it read the particle は in では as "ha"); katakana keeps the word edges clear next to hiragana particles.
const SPEAK_FIX_JA = [
  ['何百匹','ナンビャッピキ'], ['1匹ずつ','イッピキずつ'], ['米作り','コメヅクリ'], ['上の方','ウエノホウ'],
  ['巻き貝','マキガイ'], ['小川','オガワ'], ['背の','セの'], ['体','カラダ'], ['巣','ス'],
  // v40: removed ['歯が','はが'] — the voice read the hiragana は as the particle "wa". Only add misreadings actually heard.
];
function speakText(text, lang){
  if(lang!=='ja-JP') return text;
  return SPEAK_FIX_JA.reduce((t,[from,to])=>t.split(from).join(to), text);
}
function readPage(sp, form){
  form = form || formOf(sp, 0);
  if(!state.soundOn || !('speechSynthesis' in window)) return;
  if(readingKey===sp.key){ stopReading(); return; } // second tap stops
  stopReading();
  const lang = state.dexLang;
  const parts = lang==='ja'
    ? [[form.name,'en-US'],[form.jp,'ja-JP'],[sp.fact.ja,'ja-JP']]
    : [[form.name,'en-US'],[sp.fact.en,'en-US']];
  if(lang==='ja' && !pickVoice('ja-JP')) showVoiceNote(`日本語の声が見つかりませんでした(この端末の声: ${voiceCount()})`);
  const myKey = sp.key;
  readingKey = myKey;
  const b = document.getElementById('dexReadBtn'); if(b) b.classList.add('reading');
  const finish = ()=>{ if(readingKey===myKey){ readingKey=null; const bb=document.getElementById('dexReadBtn'); if(bb) bb.classList.remove('reading'); } };
  const speakPart = (i)=>{
    if(readingKey!==myKey) return;            // stopped or moved on
    if(i>=parts.length){ finish(); return; }
    const [text, l] = parts[i];
    try{
      const u = new SpeechSynthesisUtterance(speakText(text, l));
      u.lang = l;
      const v = pickVoice(l); if(v) u.voice = v;
      u.rate = l==='en-US' ? 0.85 : 0.95; u.volume = 0.9;
      u.onend = ()=> speakPart(i+1);
      u.onerror = (e)=>{
        if(l==='ja-JP' && e && e.error!=='interrupted' && e.error!=='canceled') showVoiceNote(`日本語の声で読めませんでした(${e.error||'error'})`);
        speakPart(i+1);
      };
      if(speechSynthesis.paused) speechSynthesis.resume();
      speechSynthesis.speak(u);
    }catch(e){ finish(); }
  };
  speakPart(0);
}

    ${def ? `<p class="found" lang="${lang}">🏆 ${lang==='ja' ? '見つけ方' : 'How you found it'}: ${def.find[lang]}</p>` : ''}
    <div class="nav">
      <button class="dex-small" id="dexPrevBtn" ${idx===0?'disabled':''}>◀</button>
      <span style="font-family:'Baloo 2';font-size:12px;opacity:.6;">${cfg.emoji} ${idx+1} / ${order.length}</span>
      <button class="dex-small" id="dexNextBtn" ${idx===order.length-1?'disabled':''}>▶</button>
    </div>
    ${canGo ? `<button class="btn primary goto" id="dexGoBtn">Go to ${cfg.emoji} ${cfg.name}</button>` : ''}

  dexCard.scrollTop = 0;

/* ============ MISSIONS ============
   Only these condition types exist (no new kinds per world):
   fullCount (meter filled n times) / listen (names heard n times in that world) / goodStreak (meter >= min for n ticks)
   stage (a creature reached stage n) / fullHouse (8 creatures) */
const MISSION_DEFS = {
  ocean_happy3:         { world:'ocean',  speciesKey:'seaturtle',    find:{ja:"Ocean の Happiness を3回いっぱい(100%)にした", en:"Filled Ocean Happiness to 100% three times"}, cond:{type:'fullCount', n:3} },
  ocean_listen20:       { world:'ocean',  speciesKey:'starfish',     find:{ja:"Ocean で名前を20回聞いた", en:"Listened to names in the Ocean 20 times"},    cond:{type:'listen', n:20} },
  river_clear_streak:   { world:'river',  speciesKey:'catfish',      find:{ja:"River の Water Clarity を90%以上のまま、しばらく保った", en:"Kept the River crystal clear for a while"},   cond:{type:'goodStreak', min:90, ticks:10} },
  river_stage15:        { world:'river',  speciesKey:'giantsalamander',        find:{ja:"River の生き物を Stage 15 まで育てた", en:"Grew a River creature to Stage 15"},          cond:{type:'stage', n:15} },
  suisou_comfort_streak:{ world:'suisou', speciesKey:'angelfish',    find:{ja:"Tank の Comfort を60%以上のまま、しばらく保った", en:"Kept the Tank comfortable for a while"},      cond:{type:'goodStreak', min:60, ticks:15} },
  suisou_fullhouse:     { world:'suisou', speciesKey:'cherryshrimp', find:{ja:"Tank を Full House(8ひき)にした", en:"Reached Full House in the Tank"},             cond:{type:'fullHouse'} },
  coral_happy3:         { world:'coral',  speciesKey:'mantaray',     find:{ja:"Coral Reef の Happiness を3回いっぱい(100%)にした", en:"Filled Coral Reef Happiness to 100% three times"}, cond:{type:'fullCount', n:3} },
  coral_stage25:        { world:'coral',  speciesKey:'whaleshark',   find:{ja:"Coral Reef の生き物を Stage 25 まで育てた", en:"Grew a Coral Reef creature to Stage 25"},     cond:{type:'stage', n:25} },
  deepsea_quiet_streak: { world:'deepsea',speciesKey:'giantisopod',  find:{ja:"Deep Sea を静かにしたまま(Calm 40%以上)、しばらく見続けた", en:"Kept the Deep Sea quiet for a while"},        cond:{type:'goodStreak', min:40, ticks:30} },
  deepsea_calm3:        { world:'deepsea',speciesKey:'seapig',       find:{ja:"Deep Sea の Calm を3回いっぱい(100%)にした", en:"Filled Deep Sea Calm to 100% three times"},   cond:{type:'fullCount', n:3} },
  paddy_listen20:       { world:'paddy',  speciesKey:'giantwaterbug', find:{ja:"Rice Paddy で名前を20回聞いた", en:"Listened to names in the Rice Paddy 20 times"}, cond:{type:'listen', n:20} },
  paddy_stage20:        { world:'paddy',  speciesKey:'dragonflynymph',find:{ja:"Rice Paddy の生き物を Stage 20 まで育てた", en:"Grew a Rice Paddy creature to Stage 20"},     cond:{type:'stage', n:20} },
  tidepool_comfort_streak:{ world:'tidepool', speciesKey:'nudibranch', find:{ja:"Tide Pool の Comfort を60%以上のまま、しばらく保った", en:"Kept the Tide Pool comfortable for a while"}, cond:{type:'goodStreak', min:60, ticks:15} },
  tidepool_fullhouse:   { world:'tidepool', speciesKey:'octopus',     find:{ja:"Tide Pool を Full House(8ひき)にした", en:"Reached Full House in the Tide Pool"},       cond:{type:'fullHouse'} }
};
function missionsOf(type, world){
  return Object.keys(MISSION_DEFS).filter(id=>{ const d = MISSION_DEFS[id]; return d.cond.type===type && (world==null || d.world===world); });
}
function onListened(world){
  const key = 'listen:'+world; // counted per world, so a new world's "listen" mission starts from zero
  state.progress[key] = (state.progress[key]||0) + 1;
  missionsOf('listen', world).forEach(id=>{ if(state.progress[key] >= MISSION_DEFS[id].cond.n) completeMission(id); });
}
function onMeterFull(world){
  const key = 'full:'+world;
  state.progress[key] = (state.progress[key]||0) + 1;
  missionsOf('fullCount', world).forEach(id=>{ if(state.progress[key] >= MISSION_DEFS[id].cond.n) completeMission(id); });
}
function checkGoodStreaks(world){
  const w = state.worlds[world];
  const cfg = WORLD_BY_ID[world];
  const quietOK = careOf(cfg).quiet ? isQuietNow(cfg) : true; // quiet worlds: only counts while it is actually quiet
  missionsOf('goodStreak', world).forEach(id=>{
    const c = MISSION_DEFS[id].cond;
    state.progress[id] = (w.meter >= c.min && quietOK) ? (state.progress[id]||0) + 1 : 0;
    if(state.progress[id] >= c.ticks) completeMission(id);
  });
}
function completeMission(missionId){
  if(state.missionsCompleted.includes(missionId)) return;
  const def = MISSION_DEFS[missionId];
  const world = def.world;
  const hiddenSp = SPECIES[world].find(s=>s.key===def.speciesKey);
  if(!hiddenSp || state.discovered.has(hiddenSp.key)) return;
  state.missionsCompleted.push(missionId);
  markDiscovered(hiddenSp);
  state.dexUnseen = true;
  if(state.worlds[world].creatures.length < MAX_CREATURES_PER_WORLD){
    spawnCreature(world, hiddenSp.key);
  }
  if(state.activeWorld===world){
    showBanner({en:`🎉 New friend discovered: ${hiddenSp.name}!`, ja:`🎉 新しい友だちを見つけた: ${hiddenSp.name}!`}, {top:'42%', ms:2800});
    burstSparkles();
  }
  updateHud();
}

/* Banners (v40): every banner uses the full-width row with the text centred inside it (the old translate(-50%) centring
   was cancelled by the float-up animation, so long text ran off the right edge: the "Full House" cut).
   msg is plain text, or {en, ja} which follows the page language (English first; 日本語 if chosen. Spec 2.12). */
// v41: the float-up animation used to end after 2.4s whatever the text, so long ones (Full House) vanished before anyone
// could read them. Now the time grows with the length: short ones as before, long ones up to 6s.
function bannerMs(text){ return Math.min(6000, Math.max(2400, 1200 + [...text].length * 80)); }
function showBanner(msg, opts){
  opts = (opts && typeof opts==='object') ? opts : {};
  const text = (msg && typeof msg==='object') ? msg[state.dexLang] : msg;
  const ms = Math.max(opts.ms || 0, bannerMs(text));
  const row = document.createElement('div'); row.className = opts.overlay ? 'levelup-row overlay' : 'levelup-row'; row.style.top = opts.top || '40%';
  row.style.animationDuration = ms + 'ms';
  const span = document.createElement('span'); span.textContent = text; row.appendChild(span);
  (opts.overlay ? document.body : creatureLayer).appendChild(row); setTimeout(()=>row.remove(), ms);
}
function removeCreature(world, id){

  if(idx===-1) return null;
  const [c] = w.creatures.splice(idx,1);
  c.el.remove();
  if(w.selectedId===id) w.selectedId=null;
  updateZoom(world);
  checkFullHouse(world);
  return c;
}

/* ============ SAVE CODE ============
   New format (v28~), starts with "D2":
     D2|gems|food|activeWorldId|discoveredKeys|missionIds|progress|listenCount|worlds
     (listenCount is kept only for v28 codes; since v29 the count lives in progress as 'listen:<world>' and this field is 0)
     progress: "key=value" pairs, comma-separated
     worlds:   per world "id:unlocked:meter:creatures:visited", separated by ";" (visited added in v29; missing = same as unlocked)
     creatures:"key.stage.growth", comma-separated
   Worlds are stored by id (not by position), so adding worlds later never breaks old codes.
   Codes from v27 and earlier (no "D2" at the start) are still read. */
const SAVE_TAG = 'D2';
const LEGACY_WORLDS = ['ocean','river','suisou'];
function exportSave(){
  const progressCSV = Object.keys(state.progress).filter(k=>state.progress[k]).map(k=>k+'='+state.progress[k]).join(',');
  const worldsSeg = WORLDS.map(cfg=>{
    const w = state.worlds[cfg.id];
    const cr = w.creatures.map(c=>`${c.key}.${c.stage}.${Math.floor(c.growth)}`).join(',');
    return [cfg.id, w.unlocked?1:0, w.meter, cr, w.tabSeen?1:0].join(':');
  }).join(';');
  const raw = [SAVE_TAG, state.gems, state.food, state.activeWorld, [...state.discovered].join(','),
               state.missionsCompleted.join(','), progressCSV, 0, worldsSeg].join('|');
  return btoa(unescape(encodeURIComponent(raw)));
}
function csv(s){ return s ? s.split(',').filter(Boolean) : []; }
function parseCurrentSave(parts){
  if(parts.length < 9) return null;
  const [, gems, food, active, disc, miss, prog, listen, worldsSeg] = parts;
  const progress = {};
  csv(prog).forEach(pair=>{ const i = pair.lastIndexOf('='); if(i>0) progress[pair.slice(0,i)] = Number(pair.slice(i+1))||0; });
  const worlds = {};
  (worldsSeg||'').split(';').forEach(seg=>{
    if(!seg) return;
    const [id, un, meter, cr, vis] = seg.split(':');
    worlds[id] = { unlocked: un==='1', meter:Number(meter), visited: vis==null ? un==='1' : vis==='1',
      creatures: csv(cr).map(e=>{ const [key, st, gr] = e.split('.'); return {key, stage:parseInt(st)||1, growth:parseInt(gr)||0}; }) };
  });
  return { gems:parseInt(gems)||0, food:parseInt(food), active, discovered:csv(disc), missions:csv(miss),
           progress, listenCount:parseInt(listen)||0, worlds };
}
function parseLegacySave(parts){
  // v27 layout: gems|food|activeWorldIdx|discoveredKeys|missionIds|missionProgress|unlockedFlags|meters|creatures
  if(parts.length < 9) return null;
  const [gems, food, activeIdx, disc, miss, mpCSV, unlockedStr, metersCSV, creaturesSeg] = parts;
  const mp = mpCSV.split(',').map(Number);
  const meters = metersCSV.split(',').map(Number);
  const segs = creaturesSeg.split(';');
  const worlds = {};
  LEGACY_WORLDS.forEach((id,i)=>{
    worlds[id] = { unlocked: unlockedStr[i]==='1', meter: meters[i]||0,
      creatures: csv(segs[i]).map(e=>{ const [key, st, gr] = e.split(':'); return {key, stage:parseInt(st)||1, growth:parseInt(gr)||0}; }) };
  });
  return { gems:parseInt(gems)||0, food:parseInt(food), active:LEGACY_WORLDS[parseInt(activeIdx)] || 'ocean',
           discovered:csv(disc), missions:csv(miss),
           progress:{ 'full:ocean':mp[0]||0, river_clear_streak:mp[1]||0, suisou_comfort_streak:mp[2]||0 },
           listenCount:0, worlds };
}
function importSave(code){
  let raw;
  try{ raw = decodeURIComponent(escape(atob(code.trim()))); } catch(e){ return false; }
  const parts = raw.split('|');
  const data = parts[0]===SAVE_TAG ? parseCurrentSave(parts) : parseLegacySave(parts);
  if(!data) return false;
  state.loading = true;
  Object.values(state.worlds).forEach(w=>{ w.creatures.forEach(c=>{ clearTimeout(c._swimTimer); c.el.remove(); }); w.creatures=[]; w.selectedId=null; });
  state.gems = data.gems;
  state.food = isNaN(data.food) ? 3 : data.food;
  // v40: River became a Japanese river; the otter (extinct in Japan) was replaced by the giant salamander
  const RENAMED_KEYS = {otter:'giantsalamander'};
  data.discovered = data.discovered.map(k=>RENAMED_KEYS[k]||k);
  Object.values(data.worlds||{}).forEach(d=>{ if(d && d.creatures) d.creatures.forEach(cd=>{ cd.key = RENAMED_KEYS[cd.key]||cd.key; }); });
  state.discovered = new Set(data.discovered);
  state.missionsCompleted = data.missions.filter(id=>MISSION_DEFS[id]);
  state.progress = data.progress;
  // v27/v28 counted names across all worlds; carry that count over as the Ocean count
  if(data.listenCount && !state.progress['listen:ocean']) state.progress['listen:ocean'] = data.listenCount;
  WORLDS.forEach(cfg=>{
    const wd = state.worlds[cfg.id];
    const d = data.worlds[cfg.id];
    wd.unlocked = cfg.unlock.type==='start' ? true : !!(d && d.unlocked);
    wd.meter = (d && !isNaN(d.meter)) ? d.meter : cfg.meter.start;
    wd.tabSeen = cfg.unlock.type==='start' ? true : !!(d && (d.visited==null ? d.unlocked : d.visited));
    if(d){
      d.creatures.forEach(cd=>{
        if(!SPECIES[cfg.id].some(s=>s.key===cd.key)) return; // unknown creature: skip instead of crashing
        const c = spawnCreature(cfg.id, cd.key);
        c.stage = Math.min(MAX_STAGE, cd.stage); c.growth = cd.growth;
        c.el.style.width = STAGE_SIZES[c.stage]+'px'; c.el.style.height = STAGE_SIZES[c.stage]+'px';
        applyForm(c, false);
      });
    }
    updateZoom(cfg.id);
  });
  state.loading = false;
  state.dexNew = []; state.dexUnseen = false; // a loaded save starts with everything already seen
  checkDexUnlocks();
  switchWorld(WORLD_BY_ID[data.active] ? data.active : 'ocean');
  dexCount.textContent = state.discovered.size;
  updateHud();
  return true;
}

/* ---- creature spawn / render ---- */
function spawnCreature(world, speciesKey){
  const pool = speciesKey
    ? SPECIES[world]
    : SPECIES[world].filter(s => !s.hidden || state.discovered.has(s.key));
  const sp = speciesKey ? pool.find(s=>s.key===speciesKey) : pool[Math.floor(Math.random()*pool.length)];
  markDiscovered(sp);
  const el = document.createElement('div');
  const id = idCounter++;
  el.className = 'creature body-'+(sp.body||'fish');
  el.dataset.world = world;
  el.style.width = STAGE_SIZES[1]+'px'; el.style.height = STAGE_SIZES[1]+'px';
  const zr = yRange(world, formOf(sp,0).zone, STAGE_SIZES[1]);
  const startX = 10+Math.random()*70, startY = zr ? zr[0] + Math.random()*(zr[1]-zr[0]) : 12+Math.random()*62;
  el.style.left = startX+'%'; el.style.top = startY+'%';
  el.innerHTML = `<div class="sprite">${sp.draw('neutral')}</div>`;
  const c = {id, world, key:sp.key, name:sp.name, el, stage:1, growth:0, dir:1, x:startX, y:startY, mood:'neutral', lastCared:Date.now(), speciesDraw:sp.draw};
  applyForm(c, false);
  el.addEventListener('click', (e)=>{
    e.stopPropagation();
    const w = state.worlds[world];
    if(w.selectedId === c.id){
      w.selectedId = null; el.classList.remove('selected');
    } else {
      if(w.selectedId != null){ const prev = w.creatures.find(x=>x.id===w.selectedId); if(prev) prev.el.classList.remove('selected'); }
      w.selectedId = c.id; el.classList.add('selected');
      playHeadphoneMoment(c);
    }
    updateHud();
  });
  if(world!==state.activeWorld || !state.worlds[world].unlocked) el.style.display='none';
  creatureLayer.appendChild(el);
  state.worlds[world].creatures.push(c);
  scheduleSwim(c);
  updateZoom(world);
  updateHud();
  checkFullHouse(world);
  return c;
}
function checkFullHouse(world){
  const w = state.worlds[world];
  if(w.creatures.length >= MAX_CREATURES_PER_WORLD){
    if(!w.fullHouseAnnounced){
      w.fullHouseAnnounced = true;
      if(state.activeWorld===world){
        showBanner({en:'🎉 Full House! Growth is boosted while the tank stays full.', ja:'🎉 Full House! 水槽がいっぱいの間、みんな早く育つよ。'}, {top:'38%', ms:2800});
        burstSparkles();
      }
      missionsOf('fullHouse', world).forEach(completeMission);
    }
  } else {
    w.fullHouseAnnounced = false;
  }
}

/* ---- headphone moment: tap a creature, it gets headphones + a punchy bass-forward riff, just for them ---- */
let hpReady=false, hpKick, hpBass;
function setupHeadphoneAudio(){
  hpKick = new Tone.MembraneSynth({pitchDecay:0.05,octaves:5,envelope:{attack:0.001,decay:0.4,sustain:0}}).toDestination();
  hpKick.volume.value=-7;
  hpBass = new Tone.Synth({oscillator:{type:'sine'},envelope:{attack:0.01,decay:0.25,sustain:0.2,release:0.3}}).toDestination();
  hpBass.volume.value=-8;
  hpReady=true;
}
async function playHeadphoneMoment(c){
  c.el.classList.add('headphones','bop');
  setTimeout(()=>c.el.classList.remove('headphones','bop'), 2200);
  try{
    if(!hpReady) setupHeadphoneAudio();
    await Tone.start();
    applySound();
    const now = Tone.now();
    // "zun-cha-zun-cha": kick, bass, kick, bass
    // Same timing and volume as before; only the pitches now follow the key of the world's music.
    const chord = chordAt(state.musicOn ? Tone.Transport.ticks : 0);
    const pc = n => n.replace(/[0-9]/g,'');
    const root = pc(chord[0]), fifth = pc(chord[2]);
    hpKick.triggerAttackRelease(root+'1','8n', now);
    hpBass.triggerAttackRelease(root+'2','16n', now+0.22);
    hpKick.triggerAttackRelease(root+'1','8n', now+0.42);
    hpBass.triggerAttackRelease(fifth+'2','16n', now+0.64);
  }catch(e){ /* audio unavailable — the headphone/bop visual still plays */ }
}

function scheduleSwim(c){
  const dx = (Math.random()*50-25), dy=(Math.random()*40-20);
  const newX = Math.min(82, Math.max(4, c.x+dx));
  let zr = yRange(c.world, c._emerge ? 'air' : (c.zone||'water'), c._visual);
  c._emerge = false;
  let newY;
  if(!zr) newY = Math.min(80, Math.max(6, c.y+dy));
  else if(zr[1]-zr[0] < 20 || c.y < zr[0] || c.y > zr[1]) newY = zr[0] + Math.random()*(zr[1]-zr[0]); // narrow band, or just moved to a new zone
  else newY = Math.min(zr[1], Math.max(zr[0], c.y+dy));
  c.dir = (newX >= c.x) ? 1 : -1;
  const dur = 3500 + Math.random()*2500;
  c.el.style.transition = `left ${dur}ms ease-in-out, top ${dur}ms ease-in-out, width .4s, height .4s, transform .6s`;
  c.el.style.left = newX+'%'; c.el.style.top = newY+'%';
  c.x = newX; c.y = newY;
  const sprite = c.el.querySelector('.sprite');
  const angled = Math.random() < 0.4;
  const skew = angled ? -10 : 0;
  sprite.style.transform = `scaleX(${c.dir}) skewY(${skew}deg)`;
  c.el.style.setProperty('--flip', `scaleX(${c.dir}) skewY(${skew}deg)`);
  clearTimeout(c._swimTimer);
  c._swimTimer = setTimeout(()=>scheduleSwim(c), dur);
}

/* Each creature is shrunk by the world's zoom, but never below MIN_VISUAL_PX on screen
   (about the size of a newborn), and always gets a tap area of at least MIN_TAP_PX.
   Smaller creatures sit in front, so a huge creature can't cover them. */
const MIN_VISUAL_PX = 32;
const MIN_TAP_PX = 48;
function applyCreatureScale(c){
  const w = state.worlds[c.world];
  const size = STAGE_SIZES[c.stage];
  const scale = Math.min(1, Math.max(w.zoom||1, MIN_VISUAL_PX/size));
  const visual = size*scale;
  c._visual = visual;
  const hitPad = Math.max(0, (MIN_TAP_PX - visual)/2) / scale; // in unscaled px
  c.el.style.setProperty('--zoom', scale.toFixed(4));
  c.el.style.setProperty('--hit', hitPad.toFixed(1)+'px');
  c.el.style.zIndex = String(100 - c.stage);
}
function updateZoom(world){
  const w = state.worlds[world];
  const maxSize = w.creatures.length ? Math.max(...w.creatures.map(c=>STAGE_SIZES[c.stage])) : STAGE_SIZES[1];
  w.maxStage = w.creatures.length ? Math.max(...w.creatures.map(c=>c.stage)) : 1;
  const cap = 70;
  let zoom = maxSize > cap ? cap / maxSize : 1;
  zoom = Math.max(0.12, Math.min(1, zoom));
  w.zoom = zoom;
  w.creatures.forEach(applyCreatureScale);
  if(world === state.activeWorld){
    const bgZoom = 1 - (1-zoom)*0.45; // background recedes more gently -> parallax depth
    bgLayer.style.transform = `scale(${bgZoom})`;
  }
}
function addGrowth(c, amount){
  c.growth += amount;
  if(c.growth >= GROWTH_THRESHOLD && c.stage < MAX_STAGE){
    c.growth = 0; c.stage++;
    c.el.style.width = STAGE_SIZES[c.stage]+'px'; c.el.style.height = STAGE_SIZES[c.stage]+'px';
    state.gems += 2;
    updateZoom(c.world);
    applyForm(c, true);
    missionsOf('stage', c.world).forEach(id=>{ if(c.stage >= MISSION_DEFS[id].cond.n) completeMission(id); });
    if(c.world===state.activeWorld){
      const lvl = document.createElement('div');
      lvl.className='levelup'; lvl.textContent = c.name+' grew! ✨';
      lvl.style.left = c.el.style.left; lvl.style.top = c.el.style.top;
      creatureLayer.appendChild(lvl); setTimeout(()=>lvl.remove(), 2400);
    }
    updateHud();
  }
}
function growCreature(c){
  const w = state.worlds[c.world];
  if(!w.unlocked) return;
  const cfg = WORLD_BY_ID[c.world];
  const care = careOf(cfg);
  let rate = care.quiet ? (isQuietNow(cfg) ? 3 : 1) : (state.musicOn ? 3 : 1);
  if(care.haltBelow!=null && w.meter < care.haltBelow) rate = 0; // dirty water / uncomfortable tank halts growth
  if(w.creatures.length >= MAX_CREATURES_PER_WORLD) rate *= 1.5; // Full House bonus
  addGrowth(c, rate);
}
function showNameLabel(c){
  const label = document.createElement('div');
  label.className='namelabel';
  label.textContent = '♪ '+c.name;
  label.style.left = c.el.style.left; label.style.top = c.el.style.top;
  creatureLayer.appendChild(label);
  setTimeout(()=>label.remove(), 1800);
}
function listenTo(c){
  addGrowth(c, 4);
  c.lastCared = Date.now();
  showNameLabel(c);
  onListened(c.world);
  if(state.soundOn && 'speechSynthesis' in window){
    try{
      if(speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel(); // clear a stuck queue
      readingKey = null;
      if(speechSynthesis.paused) speechSynthesis.resume();
      const u = new SpeechSynthesisUtterance(c.name);
      u.lang='en-US'; u.rate=0.85; u.pitch=1.15; u.volume=0.8;
      speechSynthesis.speak(u);
    }catch(e){ /* no TTS available — the name label above is the fallback */ }
  }
}

/* ---- mood: neglected creatures look sleepy/sad, recently-cared ones look happy.
   Thresholds are compressed (seconds, not hours) so the effect is visible in a demo session. */
function refreshMoods(){
  const now = Date.now();
  WORLDS.forEach(cfg=>{
    const w = state.worlds[cfg.id];
    const uneasy = careOf(cfg).quiet && state.musicOn && isLookingAt(cfg);
    w.creatures.forEach(c=>{
      const elapsed = now - c.lastCared;
      let mood = 'neutral';
      if(uneasy) mood = 'uneasy';
      else if(elapsed < 15000) mood = 'happy';
      else if(elapsed > 45000) mood = 'sleepy';
      if(mood !== c.mood){
        c.mood = mood;
        const spriteEl = c.el.querySelector('.sprite');
        if(spriteEl) spriteEl.innerHTML = c.speciesDraw(mood);
      }
    });
  });
}
setInterval(refreshMoods, 4000);

/* ---- world tick (every 2s): growth, then each world's care rule ---- */
function worldTick(){
  WORLDS.forEach(cfg=>{ const w = state.worlds[cfg.id]; if(w.unlocked) w.creatures.forEach(growCreature); });
  WORLDS.forEach(cfg=>{
    const w = state.worlds[cfg.id];
    if(!w.unlocked) return;
    const care = careOf(cfg);
    if(care.tick) care.tick(w, cfg);
    checkGoodStreaks(cfg.id);
    if(care.tick && state.activeWorld===cfg.id) updateHud();
  });
}
setInterval(worldTick, 2000);

/* ---- bubbles ---- */
function spawnBubble(){
  const b=document.createElement('div'); b.className='bubble';
  const size=4+Math.random()*10;
  b.style.width=size+'px'; b.style.height=size+'px'; b.style.left=Math.random()*100+'%';

  tank.appendChild(b); setTimeout(()=>b.remove(),9000);
}
setInterval(spawnBubble, 700);

function switchWorld(world){
  const firstVisit = state.worlds[world].unlocked && !state.worlds[world].tabSeen;
  state.activeWorld = world;
  state.worlds[world].tabSeen = true;
  musicWorld = MUSIC[world] ? world : 'ocean';
  Object.values(state.worlds).forEach(w=>{
    if(w.selectedId!=null){ const c=w.creatures.find(x=>x.id===w.selectedId); if(c) c.el.classList.remove('selected'); }
    w.selectedId = null;
  });

  bgLayer.querySelectorAll('svg').forEach(svg=>{ svg.style.display = svg.classList.contains('bg-'+world) ? 'block' : 'none'; });
  const overlay = tank.querySelector('.locked-overlay'); if(overlay) overlay.remove();
  document.querySelectorAll('.creature').forEach(el=>{ el.style.display = (el.dataset.world===world) ? 'block' : 'none'; });
  bgLayer.style.transform = `scale(${1 - (1-(state.worlds[world].zoom||1))*0.45})`;
  if(!state.worlds[world].unlocked) renderLockOverlay(world);
  refreshMoods();
  sayQuietPlease(); // arriving in a quiet world with music on counts as music starting there
  // v43: the first time you arrive in a newly opened world, one sentence about the real place (if the world has one)
  if(firstVisit && WORLD_BY_ID[world].firstVisitMessage) showBanner(WORLD_BY_ID[world].firstVisitMessage, {top:'30%'});
  updateHud();

/* ---- feed / add ---- */
function performAction(){
  const w = state.worlds[state.activeWorld];
  if(!w.unlocked) return;
  if(w.selectedId != null){
    const sel = w.creatures.find(c=>c.id===w.selectedId);
    if(sel) listenTo(sel);
  } else {
    const care = careOf(WORLD_BY_ID[state.activeWorld]);
    if(care.quiet){ stopMusic(); showBanner('🤫 Shhh…'); }
    w.meter = Math.min(100, w.meter + care.actionGain);
    w.creatures.forEach(c=>c.lastCared=Date.now());
    refreshMoods();
  }
  updateHud();
}
actionBtn.addEventListener('click', performAction);
addBtn.addEventListener('click', ()=>{
  const w = state.worlds[state.activeWorld];
  if(state.gems<NEW_FRIEND_COST || !w.unlocked || w.creatures.length>=MAX_CREATURES_PER_WORLD) return;
  state.gems -= NEW_FRIEND_COST;
  spawnCreature(state.activeWorld);
  updateHud();
});
treatBtn.addEventListener('click', ()=>{
  const w = state.worlds[state.activeWorld];
  if(w.selectedId==null) return;
  const sel = w.creatures.find(c=>c.id===w.selectedId);
  if(!sel || sel.mood!=='sleepy' || state.gems<TREAT_COST) return;
  state.gems -= TREAT_COST;
  addGrowth(sel, 10);
  sel.lastCared = Date.now();
  sel.mood = 'happy';
  const spriteEl = sel.el.querySelector('.sprite'); if(spriteEl) spriteEl.innerHTML = sel.speciesDraw('happy');
  showNameLabel(sel);
  burstSparkles();
  updateHud();
});

/* =====================================================
   MUSIC — Tone.js ambient loop (Minecraft-esque, sparse & warm)
   A world without its own entry here plays the Ocean music.
===================================================== */
const MUSIC = {
  ocean:{ chords:[['C4','E4','G4','B4'],['A3','C4','E4','G4'],['F3','A3','C4','E4'],['G3','B3','D4','F4']],
          notes:['C5','D5','E5','G5','A5',null,'E5','G5',null,'D5','E5',null] },
  river:{ chords:[['D4','F4','A4','C5'],['Bb3','D4','F4','A4'],['F3','A3','C4','E4'],['C4','E4','G4','Bb4']],
          notes:['D5','F5','G5','A5',null,'C5','D5',null,'A4','C5',null,'F5'] },
  suisou:{ chords:[['G3','B3','D4','F#4'],['E3','G3','B3','D4'],['C4','E4','G4','B4'],['D4','F#4','A4','C5']],
          notes:['G5','A5','B5','D6',null,'E5','G5',null,'B5','D6',null,'A5'] },
  // New worlds (v32~) may also choose: lead = melody instrument (default 'pluck'), beat:false = no kick/shaker.
  // Phone speakers barely play low notes, so new music stays in the middle and high range.
  coral:{ lead:'marimba',
          chords:[['F4','A4','C5','E5'],['D4','F4','A4','C5'],['Bb3','D4','F4','A4'],['C4','E4','G4','Bb4']],
          notes:['F5','A5','C6','A5','G5',null,'F5','G5','A5',null,'C6',null] },
  // Deep Sea: a soft music box, few notes, no beat. Quiet is the right answer here, so the music is gentle, not loud.
  /* v43 Rice Paddy: a simple flute on a Japanese five-note scale (D E G A B), with a small high drum, no kick (spec 2.11). */
  paddy:{ lead:'flute', noteLen:'4n', beat:'taiko',
          chords:[['G4','B4','D5','E5'],['E4','G4','B4','D5'],['C4','E4','G4','A4'],['D4','G4','A4','B4']],
          notes:['D5',null,'E5','G5','A5',null,'B5','A5','G5',null,'E5',null,'D5','E5','G5',null] },
  /* v43 Tide Pool: a rocking three-beat feel (a chord lasts three beats), a plucked string, and a soft wave swish. */
  tidepool:{ lead:'harp', chordBeats:3, beat:'swish',
          chords:[['A4','C#5','E5','G#5'],['F#4','A4','C#5','E5'],['D4','F#4','A4','C#5'],['E4','G#4','B4','D5']],
          notes:['C#6',null,'B5','A5',null,'E5','F#5',null,'A5','C#6',null,null,'D6',null,'C#6','A5',null,'F#5','E5',null,'G#5','B5',null,null] },
  deepsea:{ lead:'musicbox', beat:false,
          chords:[['A4','C5','E5','G5'],['F4','A4','C5','E5'],['D4','F4','A4','C5'],['E4','G4','B4','D5']],
          notes:['E6',null,null,null,'C6',null,null,null,'A5',null,null,null,'B5',null,null,null,'G5',null,null,null,null,null,null,null] }
};
let musicWorld='ocean';
let toneReady=false, pad, pluck, marimba, musicBox, flute, harp, shime, swish, leads, kick, shaker, bell, sparkleSynth, chordSeq, melodySeq, beatLoop, layerLoop;
/* The chord playing at a given transport tick. Chords change every 2 beats, or every chordBeats beats (v43: Tide Pool = 3). */
function chordBeatsOf(){ return MUSIC[musicWorld].chordBeats || 2; }
function chordAt(ticks){
  const chords = MUSIC[musicWorld].chords;
  const idx = Math.floor(ticks / (Tone.Transport.PPQ*chordBeatsOf()) + 0.001);
  return chords[((idx % chords.length) + chords.length) % chords.length];
}
function setupMusic(){
  Tone.Transport.bpm.value = 90;
  pad = new Tone.PolySynth(Tone.Synth,{oscillator:{type:'sine'},envelope:{attack:0.8,decay:0.5,sustain:0.6,release:2.2}}).toDestination();
  pad.volume.value=-17;
  pluck = new Tone.Synth({oscillator:{type:'triangle'},envelope:{attack:0.005,decay:0.3,sustain:0.05,release:0.4}}).toDestination();
  pluck.volume.value=-9;
  // Mallet sound: a quick, bright FM tone that dies away fast
  marimba = new Tone.FMSynth({harmonicity:4, modulationIndex:2, oscillator:{type:'sine'},
    envelope:{attack:0.001,decay:0.35,sustain:0,release:0.2},
    modulation:{type:'sine'}, modulationEnvelope:{attack:0.001,decay:0.08,sustain:0,release:0.05}}).toDestination();
  marimba.volume.value=-7;
  // Music box: a high, soft bell-like tone that rings a little longer
  musicBox = new Tone.FMSynth({harmonicity:3, modulationIndex:1.2, oscillator:{type:'sine'},
    envelope:{attack:0.001,decay:1.2,sustain:0,release:1}, modulation:{type:'sine'},
    modulationEnvelope:{attack:0.001,decay:0.2,sustain:0,release:0.1}}).toDestination();
  musicBox.volume.value=-11;
  // v43 flute (Rice Paddy): a soft, breathy tone with a little vibrato
  const fluteVib = new Tone.Vibrato(5, 0.08).toDestination();
  flute = new Tone.Synth({oscillator:{type:'custom', partials:[1,0.35,0.12]}, envelope:{attack:0.06,decay:0.15,sustain:0.7,release:0.35}}).connect(fluteVib);
  flute.volume.value=-10;
  // v43 harp (Tide Pool): a plucked-string tone made with FM, like the other leads.
  // (Tone.PluckSynth was tried first: it needs an AudioWorklet, which failed to load in testing and is missing on older iPhones.)
  harp = new Tone.FMSynth({harmonicity:2, modulationIndex:3, oscillator:{type:'sine'},
    envelope:{attack:0.002,decay:0.9,sustain:0,release:0.6}, modulation:{type:'triangle'},
    modulationEnvelope:{attack:0.002,decay:0.25,sustain:0,release:0.2}}).toDestination();
  harp.volume.value=-9;
  leads = {pluck, marimba, musicbox:musicBox, flute, harp};
  // v43 small high drum (like a shime-daiko) for Rice Paddy, and a soft wave swish for Tide Pool. Both stay out of the low range.
  shime = new Tone.MembraneSynth({pitchDecay:0.008, octaves:1.2, envelope:{attack:0.001,decay:0.12,sustain:0}}).toDestination();
  shime.volume.value=-14;
  swish = new Tone.NoiseSynth({noise:{type:'pink'}, envelope:{attack:0.12,decay:0.6,sustain:0}}).toDestination();
  swish.volume.value=-30;
  kick = new Tone.MembraneSynth({pitchDecay:0.02,octaves:4,envelope:{attack:0.001,decay:0.35,sustain:0}}).toDestination();
  kick.volume.value=-16;
  shaker = new Tone.NoiseSynth({noise:{type:'white'},envelope:{attack:0.001,decay:0.06,sustain:0}}).toDestination();
  shaker.volume.value=-28;
  bell = new Tone.Synth({oscillator:{type:'sine'},envelope:{attack:0.01,decay:1.4,sustain:0,release:1.1}}).toDestination();
  bell.volume.value=-15;
  sparkleSynth = new Tone.Synth({oscillator:{type:'triangle'},envelope:{attack:0.005,decay:0.6,sustain:0,release:0.4}}).toDestination();
  sparkleSynth.volume.value=-17;

  // v43: checked every beat, so a chord can last 2 beats (all older worlds, same as before) or 3 (Tide Pool)
  chordSeq = new Tone.Loop(t=>{
    const ticks = Tone.Transport.getTicksAtTime(t);
    const beats = chordBeatsOf();
    if(Math.round(ticks/Tone.Transport.PPQ) % beats === 0) pad.triggerAttackRelease(chordAt(ticks), Tone.Time('4n').toSeconds()*beats, t);
  }, '4n');
  let ni=0; melodySeq = new Tone.Loop(t=>{ const m=MUSIC[musicWorld]; const nArr=m.notes; const n=nArr[ni%nArr.length]; if(n) (leads[m.lead]||pluck).triggerAttackRelease(n, m.noteLen||'8n', t); ni++; }, '8n');
  let bi=0; beatLoop = new Tone.Loop(t=>{
    const beatType = MUSIC[musicWorld].beat;
    const withBeat = beatType == null; // the older worlds: kick + shaker, as before
    if(withBeat && bi%4===0) kick.triggerAttackRelease('C2','8n',t);
    if(withBeat && bi%4===2 && Math.random()<0.6) shaker.triggerAttackRelease('16n',t);
    const b = Math.round(Tone.Transport.getTicksAtTime(t)/Tone.Transport.PPQ); // beat number, lined up with the chords
    if(beatType==='taiko'){ // "TEN te-ke TEN -" on a small high drum
      const eighth = Tone.Time('8n').toSeconds();
      if(b%4===0 || b%4===2) shime.triggerAttackRelease('D5','16n',t,0.9);
      if(b%4===1){ shime.triggerAttackRelease('A5','16n',t,0.45); shime.triggerAttackRelease('A5','16n',t+eighth,0.45); }
    }
    if(beatType==='swish'){ // a wave on the first of every three beats, a light tick on the others
      if(b%3===0) swish.triggerAttackRelease('2n',t);
      else if(Math.random()<0.5) shaker.triggerAttackRelease('16n',t);
    }
    Tone.Draw.schedule(()=>{ pulseCreatures(); bumpProgress(); }, t);
    bi++;
  }, '4n');
  layerLoop = new Tone.Loop(t=>{
    const w = state.worlds[state.activeWorld];
    const maxStage = w ? (w.maxStage||1) : 1;
    // Both layers land exactly on beats and only use notes of the chord playing at that moment,
    // so they sit inside the music instead of fighting it.
    const chord = chordAt(Tone.Transport.getTicksAtTime(t));
    const up = n => Tone.Frequency(n).transpose(12).toNote();
    if(maxStage>=10){
      bell.triggerAttackRelease(up(chord[Math.floor(Math.random()*chord.length)]), '2n', t);
    }
    if(maxStage>=20){
      const beat2 = t + Tone.Time('4n').toSeconds();
      sparkleSynth.triggerAttackRelease(up(chord[Math.floor(Math.random()*chord.length)]), '4n', beat2);
    }
  }, '1m');
  toneReady=true;
}
let spotlightBeat = 0;
function pulseCreatures(){
  document.querySelectorAll('.creature').forEach(el=>{ el.classList.add('beat'); setTimeout(()=>el.classList.remove('beat'),150); });
  spotlightBeat++;
  if(spotlightBeat % 8 === 0){
    const w = state.worlds[state.activeWorld];
    if(w.creatures.length){
      const pick = w.creatures[Math.floor(Math.random()*w.creatures.length)];
      showNameLabel(pick);
    }
  }
}
/* Every beat while music plays: worlds with the "listen" care type fill up. */
function bumpProgress(){
  if(!state.musicOn) return;
  let activeTouched = false;
  WORLDS.forEach(cfg=>{
    if(!careOf(cfg).fillsWithMusic) return;
    const w = state.worlds[cfg.id];
    if(!w.unlocked) return;
    w.meter = Math.min(100, w.meter+1);
    if(w.meter>=100){
      w.meter=0; state.gems+=5; burstSparkles();
      onMeterFull(cfg.id);
    }
    if(cfg.id===state.activeWorld) activeTouched = true;
  });
  if(activeTouched) updateHud(); else gemCountEl.textContent=state.gems;
}
function burstSparkles(){
  for(let i=0;i<10;i++){
    const s=document.createElement('div'); s.className='sparkle';
    s.textContent=['✨','💫','⭐'][Math.floor(Math.random()*3)];
    s.style.left=(10+Math.random()*80)+'%'; s.style.top=(10+Math.random()*70)+'%';
    tank.appendChild(s); setTimeout(()=>s.remove(),900);
  }
}
function stopMusic(){
  if(!state.musicOn) return;
  try{ Tone.Transport.stop(); chordSeq.stop(); melodySeq.stop(); beatLoop.stop(); layerLoop.stop(); }catch(e){}
  state.musicOn=false; musicBtn.textContent='▶ Music'; musicBtn.classList.remove('playing'); tank.classList.remove('music-on');
}
async function startMusic(){
  if(!toneReady) setupMusic();
  await Tone.start();
  applySound();
  if(state.musicOn) return;
  chordSeq.start(0); melodySeq.start(0); beatLoop.start(0); layerLoop.start(0); Tone.Transport.start();
  state.musicOn=true; musicBtn.textContent='⏸ Pause'; musicBtn.classList.add('playing'); tank.classList.add('music-on');
  sayQuietPlease();
}
musicBtn.addEventListener('click', async ()=>{
  // v40: ▶ Music always plays this world's song. A song picked in 🎵 Songs lasts until the music is stopped.
  if(!state.musicOn){ musicWorld = MUSIC[state.activeWorld] ? state.activeWorld : 'ocean'; await startMusic(); } else { stopMusic(); }
  refreshMoods();
  updateHud();
});

/* ---- 🔊 / 🔇 : turns every sound off (music, spoken names, headphone riff).
   The game itself keeps going: creatures dance and grow, names still appear as text.
   Not saved — reopening the page always starts with sound on.
   (The iPhone silent switch mutes the music but not the spoken names, and a page
   cannot change that — tried in v30 — so this button is the one place to turn all sound off.) */
const soundBtn = document.getElementById('soundBtn');
function applySound(){
  try{ if(window.Tone && Tone.Destination) Tone.Destination.mute = !state.soundOn; }catch(e){}
  if(!state.soundOn){ try{ if('speechSynthesis' in window) speechSynthesis.cancel(); }catch(e){} }
  soundBtn.textContent = state.soundOn ? '🔊' : '🔇';
  soundBtn.setAttribute('aria-label', state.soundOn ? 'Sound on' : 'Sound off');
}
soundBtn.addEventListener('click', ()=>{ state.soundOn = !state.soundOn; if(!state.soundOn) readingKey = null; applySound(); updateReadBtn(); });

/* ---- start ---- */
buildWorldNav();
spawnCreature('ocean','clownfish'); spawnCreature('ocean','seasnail'); spawnCreature('ocean','hermitcrab');
state.dexNew = []; state.dexUnseen = false; // the starting friends are not "new"
switchWorld('ocean');

/* tap anywhere on the tank that ISN'T a creature -> deselect (creature clicks stopPropagation, so this only fires for empty space) */
tank.addEventListener('click', ()=>{
  const w = state.worlds[state.activeWorld];
  if(w.selectedId != null){
    const c = w.creatures.find(x=>x.id===w.selectedId);
    if(c) c.el.classList.remove('selected');
    w.selectedId = null;
    updateHud();
  }
});

function stopEverythingWhenHidden(){
  stopMusic();
  try{ if('speechSynthesis' in window) speechSynthesis.cancel(); }catch(e){}
}
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) stopEverythingWhenHidden(); });
window.addEventListener('pagehide', stopEverythingWhenHidden);
</script>
